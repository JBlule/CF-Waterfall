<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cash-flow waterfall engine &mdash; test run</title>
<style>
  :root { --paper:#f4f1ea; --ink:#232021; --rule:#d6cfc0;
          --pass:#2f6b4f; --fail:#a3372c; }
  body { margin:0; padding:2rem; background:var(--paper); color:var(--ink);
         font:13px/1.55 "SFMono-Regular",Consolas,"Liberation Mono",monospace; }
  h1 { font:600 20px/1.3 Georgia,serif; margin:0 0 .25rem; }
  .sub { color:#6d665c; margin-bottom:1.5rem; font-family:Georgia,serif;
         font-style:italic; }
  #verdict { padding:.9rem 1.1rem; border:1px solid var(--rule);
             border-left-width:4px; background:#fffdf8; margin-bottom:1.5rem;
             font-weight:600; }
  #verdict.green { border-left-color:var(--pass); color:var(--pass); }
  #verdict.red   { border-left-color:var(--fail); color:var(--fail); }
  pre { white-space:pre-wrap; background:#fffdf8; border:1px solid var(--rule);
        padding:1rem; overflow-x:auto; }
  .l-pass { color:var(--pass); }
  .l-fail { color:var(--fail); font-weight:700; }
  .l-head { font-weight:700; }
</style>
</head>
<body>
<h1>Cash-flow waterfall &mdash; engine test run</h1>
<p class="sub">Same suite the CLI runs (<code>cscript //nologo run_tests.wsf</code>).
   Engine only &mdash; no UI is loaded on this page.</p>
<div id="verdict">running&hellip;</div>
<pre id="out"></pre>

<script src="../src/engine.js"></script>
<script src="harness.js"></script>
<script src="../data/graph_data.js"></script>
<script src="oracle_data.js"></script>
<script src="test_units.js"></script>
<script src="test_oracle.js"></script>
<script src="test_graph.js"></script>
<script>
(function () {
  T.emit(T.rep("=", 72));
  T.emit("CASH-FLOW WATERFALL ENGINE -- TEST RUN");
  T.emit(T.rep("=", 72));

  runUnitTests();
  var oracle = runOracleTests();
  runGraphTests();
  var cov = reportCoverage();
  var all = T.summary("TOTAL");

  var lines = T.text().split("\n");
  var html = lines.map(function (l) {
    var cls = /^\s{2}PASS\s/.test(l) ? "l-pass"
            : /^\s{2}FAIL\s|^\s{2}\[|^RESULT: FAILING/.test(l) ? "l-fail"
            : /^={5,}|^---|^\s{2}(HIT|---)\s/.test(l) ? "l-head" : "";
    var esc = l.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    return cls ? '<span class="' + cls + '">' + esc + "</span>" : esc;
  }).join("\n");
  document.getElementById("out").innerHTML = html;

  var v = document.getElementById("verdict");
  var green = all.fail === 0;
  v.className = green ? "green" : "red";
  v.textContent = (green ? "GREEN — " : "FAILING — ")
    + all.pass + " passed, " + all.fail + " failed · "
    + oracle.passCount + "/" + oracle.total + " oracle scenarios · "
    + oracle.cells + " cells compared · worst divergence "
    + T.fmt(oracle.worst) + " · branches " + cov.covered + "/" + cov.total;
})();
</script>
</body>
</html>
